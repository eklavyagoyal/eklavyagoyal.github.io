{{- /* Comments - Giscus (GitHub Discussions) */ -}}
{{- if .Site.Params.giscus.enabled -}}
  <section class="giscus mt-12 pt-8 border-t border-light-border dark:border-dark-border" aria-labelledby="comments-title">
    <h3 id="comments-title" class="text-2xl font-bold text-light-fg dark:text-dark-fg mb-6">
      Comments
    </h3>
    
    <script src="https://giscus.app/client.js"
            data-repo="{{ .Site.Params.giscus.repo }}"
            data-repo-id="{{ .Site.Params.giscus.repoId }}"
            data-category="{{ .Site.Params.giscus.category }}"
            data-category-id="{{ .Site.Params.giscus.categoryId }}"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="en"
            crossorigin="anonymous"
            async>
    </script>
  </section>
{{- end -}}
